name: build-and-test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make -C linux test all
      - name: Build and test portable firmware encoder
        run: |
          cmake -S firmware/tests -B build/firmware-host
          cmake --build build/firmware-host
          ctest --test-dir build/firmware-host --output-on-failure
      - run: EDGE_SERVER="$PWD/linux/build/edge_scheduler" EDGE_FRAME_TEST="$PWD/build/firmware-host/test_frame" python3 -m unittest discover -s tests -v
      - run: make -C linux sanitize
      - name: Exercise network and shutdown under sanitizers
        run: EDGE_SERVER="$PWD/linux/build-sanitize/edge_scheduler" EDGE_FRAME_TEST="$PWD/build/firmware-host/test_frame" python3 -m unittest discover -s tests -v
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - run: . /opt/esp/idf/export.sh && idf.py set-target esp32 && idf.py build
        shell: bash
        working-directory: firmware
  uno-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli compile --fqbn arduino:avr:uno firmware/coloreasyduino/EdgeDevice
  esp32c3-arduino:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned official ESP32 Arduino core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile the tested ESP32-C3 DIO firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3:FlashMode=dio,FlashFreq=40,FlashSize=8M firmware/esp32c3-arduino/EdgeWiFi
